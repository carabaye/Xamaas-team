<!DOCTYPE html>
<html lang="so">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>XAMAAS TEAM - Sign Up</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#020817;
    color:white;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:500px;
}

.logo{
    text-align:center;
    margin-bottom:30px;
}

.logo-icon{
    font-size:70px;
    margin-bottom:10px;
}

.logo h1{
    color:#d4af37;
    font-size:32px;
    margin-bottom:8px;
}

.logo p{
    color:#8f9bad;
    font-size:16px;
}

.box{
    background:#071426;
    border:1px solid #263a58;
    border-radius:25px;
    padding:30px;
    box-shadow:0 10px 40px rgba(0,0,0,.35);
}

.box h2{
    text-align:center;
    color:#d4af37;
    margin-bottom:25px;
    font-size:26px;
}

label{
    display:block;
    margin-bottom:8px;
    color:#dfe6ef;
    font-weight:bold;
}

input{
    width:100%;
    padding:16px;
    margin-bottom:18px;
    border-radius:14px;
    border:1px solid #304761;
    background:#10233a;
    color:white;
    font-size:16px;
    outline:none;
}

input:focus{
    border-color:#d4af37;
}

button{
    width:100%;
    padding:17px;
    border:none;
    border-radius:15px;
    background:#d4af37;
    color:#071426;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    opacity:.9;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.message{
    display:none;
    margin-top:20px;
    padding:15px;
    border-radius:12px;
    font-size:15px;
    line-height:1.6;
    word-break:break-word;
}

.success{
    display:block;
    background:#063b24;
    border:1px solid #0e8f58;
    color:#8ff0c3;
}

.error{
    display:block;
    background:#3b0b0b;
    border:1px solid #d33;
    color:#ffb0b0;
}

.info{
    display:block;
    background:#102b45;
    border:1px solid #2878ad;
    color:#a9dcff;
}

.back{
    display:block;
    text-align:center;
    margin-top:22px;
    color:#d4af37;
    text-decoration:none;
    font-weight:bold;
}

.back:hover{
    text-decoration:underline;
}

.small{
    text-align:center;
    color:#7f8da0;
    font-size:13px;
    margin-top:18px;
    line-height:1.5;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">
        <div class="logo-icon">⚽</div>
        <h1>XAMAAS TEAM</h1>
        <p>Football Management System</p>
    </div>

    <div class="box">

        <h2>CREATE PLAYER ACCOUNT</h2>

        <label for="fullName">Full Name</label>
        <input
            type="text"
            id="fullName"
            placeholder="Geli magacaaga"
        >

        <label for="email">Email</label>
        <input
            type="email"
            id="email"
            placeholder="Geli email-kaaga"
        >

        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            placeholder="Ugu yaraan 6 xaraf"
        >

        <label for="confirmPassword">Confirm Password</label>
        <input
            type="password"
            id="confirmPassword"
            placeholder="Mar kale geli password-ka"
        >

        <button id="createBtn" onclick="createAccount()">
            CREATE ACCOUNT
        </button>

        <div id="message" class="message"></div>

        <a href="index.html" class="back">
            ← BACK TO LOGIN
        </a>

        <p class="small">
            Xamaas Team Football Management System
        </p>

    </div>

</div>


<!-- Supabase JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =====================================================
   1. SUPABASE XOGTAADA HALKAN GALI
   ===================================================== */

const SUPABASE_URL = https://iihtxtuilegjslmrkjnp.supabase.co/rest/v1/

const SUPABASE_PUBLISHABLE_KEY =
sb_publishable_lh68Dlz5pKO1lZx5WDS7jA_ODfNaw8W


/* =====================================================
   2. SUPABASE CLIENT
   ===================================================== */

let supabaseClient = null;


/* =====================================================
   3. MESSAGE
   ===================================================== */

function showMessage(text, type){

    const message = document.getElementById("message");

    message.className = "message " + type;

    message.innerHTML = text;

    message.style.display = "block";
}


/* =====================================================
   4. HUBI SUPABASE INUU SI SAX AH U DIYAAR YAHAY
   ===================================================== */

function initializeSupabase(){

    try{

        if(
            SUPABASE_URL.includes("GELI_SUPABASE") ||
            SUPABASE_PUBLISHABLE_KEY.includes("GELI_SUPABASE")
        ){

            showMessage(
                "❌ <b>Supabase lama gelin.</b><br><br>" +
                "Fadlan geli Project URL iyo Publishable Key qaybta kore ee koodhka.",
                "error"
            );

            return false;
        }


        if(!window.supabase){

            showMessage(
                "❌ <b>Supabase Library lama helin.</b><br><br>" +
                "Hubi internet-ka kadibna bogga mar kale fur.",
                "error"
            );

            return false;
        }


        supabaseClient = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );

        return true;

    }catch(error){

        showMessage(
            "❌ <b>Supabase lama bilaabi karin.</b><br><br>" +
            "Qaladku waa: " +
            escapeHtml(error.message),
            "error"
        );

        return false;
    }
}


/* =====================================================
   5. CREATE ACCOUNT
   ===================================================== */

async function createAccount(){

    const button = document.getElementById("createBtn");

    const fullName =
        document.getElementById("fullName").value.trim();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;


    /* Nadiifi fariintii hore */

    document.getElementById("message").style.display = "none";


    /* Hubi magaca */

    if(fullName === ""){

        showMessage(
            "❌ Fadlan geli magaca ciyaaryahanka.",
            "error"
        );

        return;
    }


    /* Hubi email */

    if(email === ""){

        showMessage(
            "❌ Fadlan geli email-ka.",
            "error"
        );

        return;
    }


    /* Hubi password */

    if(password === ""){

        showMessage(
            "❌ Fadlan geli password-ka.",
            "error"
        );

        return;
    }


    /* Password ugu yaraan 6 */

    if(password.length < 6){

        showMessage(
            "❌ Password-ku waa inuu ahaadaa ugu yaraan 6 xaraf.",
            "error"
        );

        return;
    }


    /* Hubi labada password */

    if(password !== confirmPassword){

        showMessage(
            "❌ Labada password isku mid ma aha.",
            "error"
        );

        return;
    }


    /* Bilaabi Supabase */

    if(!supabaseClient){

        const ready = initializeSupabase();

        if(!ready){
            return;
        }
    }


    /* Loading */

    button.disabled = true;

    button.innerText = "ACCOUNT-KA WAA LA SAMEYNAYAA...";


    showMessage(
        "⏳ Fadlan sug, account-ka ayaa la sameynayaa...",
        "info"
    );


    try{

        const { data, error } =
        await supabaseClient.auth.signUp({

            email: email,

            password: password,

            options: {
                data: {
                    full_name: fullName
                }
            }

        });


        /* Haddii Supabase qalad soo celiyo */

        if(error){

            console.log("SUPABASE ERROR:", error);

            let errorMessage =
                escapeHtml(error.message);


            /* Qaladaad caan ah */

            if(
                error.message.toLowerCase().includes("already registered")
            ){

                errorMessage =
                    "Email-kan hore ayaa account loogu sameeyay.";

            }
            else if(
                error.message.toLowerCase().includes("invalid email")
            ){

                errorMessage =
                    "Email-ka aad gelisay sax ma aha.";

            }
            else if(
                error.message.toLowerCase().includes("password")
            ){

                errorMessage =
                    "Password-ka waxaa jira qalad. Hubi inuu yahay ugu yaraan 6 xaraf.";

            }
            else if(
                error.message.toLowerCase().includes("fetch")
            ){

                errorMessage =
                    "Internet-ka ama xiriirka Supabase ayaa cilad leh.";

            }


            showMessage(
                "❌ <b>ACCOUNT-KA LAMA SAMEYN.</b><br><br>" +
                "<b>Sababta:</b><br>" +
                errorMessage +
                "<br><br>" +
                "<small>Qalad faahfaahsan: " +
                escapeHtml(error.message) +
                "</small>",
                "error"
            );


            button.disabled = false;
            button.innerText = "CREATE ACCOUNT";

            return;
        }


        /* Haddii account-ku si guul ah u sameysmo */

        showMessage(
            "✅ <b>ACCOUNT-KA WAA LA SAMEEYAY!</b><br><br>" +
            "Magaca: " + escapeHtml(fullName) +
            "<br>" +
            "Email: " + escapeHtml(email) +
            "<br><br>" +
            "Hadda waxaad ku noqon kartaa Login.",
            "success"
        );


        button.innerText = "ACCOUNT CREATED ✓";


        /* 2 ilbiriqsi kadib Login */

        setTimeout(function(){

            window.location.href = "index.html";

        },2000);


    }catch(error){

        console.log("JAVASCRIPT ERROR:", error);

        showMessage(
            "❌ <b>QALAD AYA DHACAY.</b><br><br>" +
            "<b>Faahfaahinta qaladka:</b><br>" +
            escapeHtml(error.message) +
            "<br><br>" +
            "Haddii qaladkani sii socdo, hubi Supabase URL-ka iyo Publishable Key-ga.",
            "error"
        );


        button.disabled = false;

        button.innerText = "CREATE ACCOUNT";
    }

}


/* =====================================================
   6. KA HORTAG HTML ERROR
   ===================================================== */

function escapeHtml(text){

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}


/* =====================================================
   7. BILAAB SUPABASE MARKA BOGGU FURMO
   ===================================================== */

window.addEventListener("load", function(){

    initializeSupabase();

});

</script>

</body>
</html>
