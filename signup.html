<!DOCTYPE html>
<html lang="so">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Xamaas Team - Sign Up</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#07111f;
    color:white;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.signup-box{
    width:100%;
    max-width:430px;
    background:#10243b;
    border:1px solid #304761;
    border-radius:25px;
    padding:30px 25px;
    text-align:center;
    box-shadow:0 15px 40px rgba(0,0,0,.35);
}

.logo{
    width:85px;
    height:85px;
    margin:0 auto 18px;
    border-radius:50%;
    background:#d4af37;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:40px;
}

h1{
    color:#d4af37;
    margin-bottom:8px;
}

.subtitle{
    color:#9eacbc;
    margin-bottom:28px;
}

input{
    width:100%;
    padding:16px;
    margin-bottom:14px;
    border-radius:13px;
    border:1px solid #405873;
    background:#07111f;
    color:white;
    font-size:16px;
    outline:none;
}

input:focus{
    border-color:#d4af37;
}

.signup-button{
    width:100%;
    padding:16px;
    border:0;
    border-radius:13px;
    background:#d4af37;
    color:#07111f;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.signup-button:hover{
    background:#e7c653;
}

.back{
    display:block;
    margin-top:20px;
    color:#d4af37;
    text-decoration:none;
    font-size:15px;
}

.message{
    margin-top:18px;
    color:#ff8585;
    font-size:14px;
}
</style>
</head>

<body>

<div class="signup-box">

    <div class="logo">⚽</div>

    <h1>XAMAAS TEAM</h1>

    <p class="subtitle">Create Your Account</p>

    <input
        type="text"
        id="fullname"
        placeholder="Full Name"
    >

    <input
        type="email"
        id="email"
        placeholder="Email"
    >

    <input
        type="password"
        id="password"
        placeholder="Password"
    >

    <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm Password"
    >

    <button
        class="signup-button"
        onclick="signup()"
    >
        📝 CREATE ACCOUNT
    </button>

    <div class="message" id="message"></div>

    <a class="back" href="index.html">
        ← Back to Login
    </a>

</div>

<script>

/* SUPABASE CONNECTION */

const supabaseUrl = "GELI_API_URL_KAAGA";
const supabaseKey = "GELI_PUBLISHABLE_KEY_KAAGA";

const supabaseClient =
    window.supabase.createClient(
        supabaseUrl,
        supabaseKey
    );


/* SIGN UP */

async function signup(){

    const fullname =
        document.getElementById("fullname").value.trim();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;

    const message =
        document.getElementById("message");


    /* CHECK EMPTY */

    if(
        fullname === "" ||
        email === "" ||
        password === "" ||
        confirmPassword === ""
    ){
        message.innerText =
        "Fadlan buuxi dhammaan meelaha.";
        return;
    }


    /* CHECK PASSWORD */

    if(password !== confirmPassword){

        message.innerText =
        "Passwords-ku isku mid ma aha.";

        return;
    }


    /* CREATE ACCOUNT */

    message.style.color = "#d4af37";
    message.innerText =
    "Account-ka waa la abuurayaa...";


    const { data, error } =
        await supabaseClient.auth.signUp({

            email: email,

            password: password,

            options: {

                data: {
                    full_name: fullname
                }

            }

        });


    /* ERROR */

    if(error){

        message.style.color = "#ff8585";

        message.innerText =
        error.message;

        return;
    }


    /* SUCCESS */

    message.style.color = "#62d98b";

    message.innerText =
    "Account-ka waa la sameeyay!";


    setTimeout(function(){

        window.location.href =
        "index.html";

    }, 2000);

}

</script>

</body>
</html>
