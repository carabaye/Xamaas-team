<!DOCTYPE html>
<html lang="so">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>XAMAAS TEAM - Signup</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #071b33;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
    }

    .signup-box {
      width: 92%;
      max-width: 420px;
      background: #0d2948;
      padding: 28px;
      border-radius: 16px;
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #b9c8d8;
      margin-bottom: 24px;
    }

    label {
      display: block;
      margin: 14px 0 7px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #45617c;
      border-radius: 9px;
      background: #071b33;
      color: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: 0;
      border-radius: 9px;
      background: #f0c419;
      color: #111;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
    }

    #message {
      min-height: 25px;
      margin-top: 16px;
      text-align: center;
      line-height: 1.5;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #f0c419;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="signup-box">

    <h1>XAMAAS TEAM</h1>

    <div class="subtitle">
      Create Player Account
    </div>

    <label>Full Name</label>

    <input
      id="fullName"
      type="text"
      placeholder="Magaca oo buuxa"
    >

    <label>Email</label>

    <input
      id="email"
      type="email"
      placeholder="Email-ka"
    >

    <label>Password</label>

    <input
      id="password"
      type="password"
      placeholder="Password"
    >

    <label>Confirm Password</label>

    <input
      id="confirmPassword"
      type="password"
      placeholder="Ku celi password-ka"
    >

    <button
      id="createBtn"
      type="button"
      onclick="createAccount()"
    >
      📝 CREATE ACCOUNT
    </button>

    <div id="message"></div>

    <a class="back" href="index.html">
      ← Back to Login
    </a>

  </div>


  <script>

    /* =========================================
       1. SUPABASE
       ========================================= */

    const SUPABASE_URL =
      https://iihtxtuilegjslmrkjnp.supabase.co/rest/v1/

    const SUPABASE_PUBLISHABLE_KEY =
      sb_publishable_lh68Dlz5pKO1lZx5WDS7jA_ODfNaw8W


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    /* =========================================
       2. CREATE ACCOUNT
       ========================================= */

    window.createAccount = async function () {

      const button =
        document.getElementById("createBtn");

      const message =
        document.getElementById("message");


      const fullName =
        document.getElementById("fullName").value.trim();


      const email =
        document.getElementById("email").value.trim();


      const password =
        document.getElementById("password").value;


      const confirmPassword =
        document.getElementById("confirmPassword").value;


      message.innerText = "";


      /* Hubi meelaha bannaan */

      if (
        fullName === "" ||
        email === "" ||
        password === "" ||
        confirmPassword === ""
      ) {

        message.style.color = "#ff8585";

        message.innerText =
          "Fadlan buuxi dhammaan meelaha.";

        return;
      }


      /* Hubi labada password */

      if (password !== confirmPassword) {

        message.style.color = "#ff8585";

        message.innerText =
          "Passwords-ku isma laha.";

        return;
      }


      /* Password ugu yaraan 6 */

      if (password.length < 6) {

        message.style.color = "#ff8585";

        message.innerText =
          "Password-ku waa inuu ahaadaa ugu yaraan 6 xaraf.";

        return;
      }


      button.disabled = true;

      button.innerText = "Creating...";


      try {

        /* SUPABASE SIGNUP */

        const { data, error } =
          await supabaseClient.auth.signUp({

            email: email,

            password: password,

            options: {

              data: {
                full_name: fullName
              }

            }

          });


        /* Haddii Supabase qalad soo celiyo */

        if (error) {
          throw error;
        }


        /* Haddii email confirmation ON yahay */

        if (data.user && !data.session) {

          message.style.color = "#62d98b";

          message.innerText =
            "Account-ka waa la sameeyay. Fadlan email-kaaga ka fur oo xaqiiji account-ka.";

        }

        else {

          message.style.color = "#62d98b";

          message.innerText =
            "Account-ka waa la sameeyay!";


          setTimeout(function () {

            window.location.href =
              "index.html";

          }, 1500);

        }


      }

      catch (error) {

        console.error(
          "SIGNUP ERROR:",
          error
        );


        message.style.color = "#ff8585";

        message.innerText =
          "Qalad: " +
          (error.message ||
           "Wax qalad ah ayaa dhacay.");

      }


      finally {

        button.disabled = false;

        button.innerText =
          "📝 CREATE ACCOUNT";

      }

    };

  </script>

</body>
</html>
