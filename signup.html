 <!DOCTYPE html>
<html lang="so">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XAMAAS TEAM - Sign Up</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    font-family:Arial,sans-serif;
    background:#020817;
    color:white;
    min-height:100vh;
    padding:25px 15px;
}

.container{
    max-width:520px;
    margin:auto;
}

.logo{
    text-align:center;
    margin-bottom:25px;
}

.logo-icon{
    font-size:65px;
}

.logo h1{
    color:#d4af37;
    font-size:32px;
    margin:8px 0;
}

.logo p{
    color:#9aa6b8;
}

.box{
    background:#020817;
    border:1px solid #30415c;
    border-radius:25px;
    padding:30px;
}

h2{
    color:#d4af37;
    text-align:center;
    margin-bottom:30px;
}

label{
    display:block;
    margin:15px 0 8px;
    font-weight:bold;
}

input{
    width:100%;
    padding:16px;
    border-radius:14px;
    border:1px solid #304761;
    background:#0b1c32;
    color:white;
    font-size:16px;
}

button{
    width:100%;
    margin-top:25px;
    padding:17px;
    border:0;
    border-radius:15px;
    background:#b47b00;
    color:white;
    font-size:18px;
    font-weight:bold;
}

button:disabled{
    opacity:.6;
}

.message{
    display:none;
    margin-top:20px;
    padding:16px;
    border-radius:12px;
    line-height:1.6;
    word-break:break-word;
}

.success{
    display:block;
    background:#063b24;
    border:1px solid #15915d;
    color:#9ff3c9;
}

.error{
    display:block;
    background:#400909;
    border:1px solid #e33;
    color:#ffb0b0;
}

.info{
    display:block;
    background:#092a43;
    border:1px solid #287cae;
    color:#b5e2ff;
}

.diagnostic{
    display:block;
    margin-top:20px;
    padding:16px;
    background:#111827;
    border:1px solid #475569;
    border-radius:12px;
    font-size:13px;
    line-height:1.7;
    word-break:break-word;
}

.diagnostic b{
    color:#d4af37;
}

.back{
    display:block;
    text-align:center;
    margin-top:22px;
    color:#d4af37;
    text-decoration:none;
}
</style>
</head>

<body>

<div class="container">

<div class="logo">
    <div class="logo-icon">⚽</div>
    <h1>XAMAAS TEAM</h1>
    <p>Football Management System</p>
</div>

<div class="box">

<h2>CREATE PLAYER ACCOUNT</h2>

<label>Full Name</label>
<input id="fullName" type="text" placeholder="Geli magacaaga">

<label>Email</label>
<input id="email" type="email" placeholder="Geli email-kaaga">

<label>Password</label>
<input id="password" type="password" placeholder="Ugu yaraan 6 xaraf">

<label>Confirm Password</label>
<input id="confirmPassword" type="password" placeholder="Mar kale geli password-ka">

<button id="createBtn" onclick="createAccount()">
CREATE ACCOUNT
</button>

<div id="message" class="message"></div>

<div id="diagnostic" class="diagnostic">
<b>🔎 SYSTEM DIAGNOSTIC</b><br>
Bogga ayaa hubinaya khaladaadka...
</div>

<a href="index.html" class="back">
← BACK TO LOGIN
</a>

</div>
</div>


<!-- SUPABASE LIBRARY -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<!-- ERROR MONITOR -->
<script>

window.onerror = function(message, source, lineno, colno, error){

    const box = document.getElementById("diagnostic");

    if(box){

        box.innerHTML =
        "<b>🔴 JAVASCRIPT ERROR</b><br><br>" +

        "<b>Qalad:</b> " +
        escapeText(message) +

        "<br><br>" +

        "<b>Line:</b> " +
        lineno +

        "<br>" +

        "<b>Column:</b> " +
        colno +

        "<br><br>" +

        "<b>File:</b><br>" +
        escapeText(source);

    }

    return false;
};


window.addEventListener("unhandledrejection", function(event){

    const box = document.getElementById("diagnostic");

    if(box){

        let reason = event.reason;

        if(reason && reason.message){
            reason = reason.message;
        }

        box.innerHTML =
        "<b>🔴 ASYNC ERROR</b><br><br>" +
        "<b>Qalad:</b><br>" +
        escapeText(String(reason));
    }

});


function escapeText(text){

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}

</script>


<!-- MAIN PROGRAM -->
<script>

try{

/* =================================================
   SUPABASE SETTINGS
   HALKAN KELIYA AYAAD XOGTA GELINAYSAA
   ================================================= */

const SUPABASE_URL="https://iihtxtuilegjslmrkjnp.supabase.co"

const SUPABASE_PUBLISHABLE_KEY =sb_publishable_...


/* =================================================
   HUBINTA SUPABASE
   ================================================= */

const diagnostic =
document.getElementById("diagnostic");


if(!window.supabase){

    diagnostic.innerHTML =
    "<b>🔴 SUPABASE LIBRARY ERROR</b><br><br>" +
    "Supabase JavaScript library lama soo dejin.";
    
}
else if(
    SUPABASE_URL.includes("GELI_") ||
    SUPABASE_PUBLISHABLE_KEY.includes("GELI_") ||
    SUPABASE_PUBLISHABLE_KEY.includes("SB_PUBLISHABLE_KEY")
){

    diagnostic.innerHTML =
    "<b>🔴 SUPABASE KEY ERROR</b><br><br>" +
    "URL ama Publishable Key weli lama gelin.<br><br>" +
    "Hubi labada meelood ee SUPABASE_URL iyo SUPABASE_PUBLISHABLE_KEY.";

}
else{

    const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );

    diagnostic.innerHTML =
    "<b>🟢 SUPABASE CLIENT OK</b><br><br>" +
    "Supabase JavaScript si sax ah ayuu u bilaabmay.<br>" +
    "Hadda CREATE ACCOUNT waa diyaar.";

    
    /* =============================================
       CREATE ACCOUNT
       ============================================= */

    window.createAccount = async function(){

        const button =
        document.getElementById("createBtn");

        const message =
        document.getElementById("message");

        const fullName =
        document.getElementById("fullName").value.trim();

        const email =
        document.getElementById("email").value.trim();

        const password =
        document.getElementById("password").value;

        const confirmPassword =
        document.getElementById("confirmPassword").value;


        message.className="message";


        /* NAME */

        if(!fullName){

            showMessage(
                "❌ Magaca geli.",
                "error"
            );

            return;
        }


        /* EMAIL */

        if(!email){

            showMessage(
                "❌ Email-ka geli.",
                "error"
            );

            return;
        }


        /* PASSWORD */

        if(password.length < 6){

            showMessage(
                "❌ Password-ku waa inuu noqdaa ugu yaraan 6 xaraf.",
                "error"
            );

            return;
        }


        /* CONFIRM */

        if(password !== confirmPassword){

            showMessage(
                "❌ Labada password isku mid ma aha.",
                "error"
            );

            return;
        }


        button.disabled=true;
        button.innerText="ACCOUNT-KA WAA LA SAMEYNAYAA...";


        showMessage(
            "⏳ Supabase ayaa account-ka sameynaya...",
            "info"
        );


        diagnostic.innerHTML =
        "<b>🟡 SUPABASE REQUEST</b><br><br>" +
        "Codsiga account-ka ayaa loo dirayaa Supabase...";


        try{

            const result =
            await supabaseClient.auth.signUp({

                email:email,

                password:password,

                options:{
                    data:{
                        full_name:fullName
                    }
                }

            });


            const data=result.data;
            const error=result.error;


            /* =====================================
               SUPABASE ERROR
               ===================================== */

            if(error){

                diagnostic.innerHTML =
                "<b>🔴 SUPABASE ERROR</b><br><br>" +

                "<b>Error message:</b><br>" +
                escapeText(error.message) +

                "<br><br>" +

                "<b>Error name:</b><br>" +
                escapeText(error.name || "Unknown") +

                "<br><br>" +

                "<b>Status:</b><br>" +
                escapeText(String(error.status || "Unknown"));

                
                showMessage(
                    "❌ <b>ACCOUNT-KA LAMA SAMEYN.</b><br><br>" +
                    escapeText(error.message),
                    "error"
                );


                button.disabled=false;
                button.innerText="CREATE ACCOUNT";

                return;
            }


            /* =====================================
               SUCCESS
               ===================================== */

            diagnostic.innerHTML =
            "<b>🟢 ACCOUNT CREATED</b><br><br>" +
            "Supabase wuxuu aqbalay account-ka.<br>" +
            "User ID: " +
            escapeText(data.user?.id || "Unknown");


            showMessage(
                "✅ <b>ACCOUNT-KA WAA LA SAMEEYAY!</b><br><br>" +
                "Waxaad hadda ku noqon kartaa Login.",
                "success"
            );


            button.innerText="ACCOUNT CREATED ✓";


        }catch(error){

            diagnostic.innerHTML =
            "<b>🔴 REQUEST ERROR</b><br><br>" +
            "<b>Qalad:</b><br>" +
            escapeText(error.message) +
            "<br><br>" +
            "<b>Stack:</b><br>" +
            escapeText(error.stack || "No stack information");


            showMessage(
                "❌ Qalad ayaa dhacay. Eeg qaybta <b>SYSTEM DIAGNOSTIC</b>.",
                "error"
            );


            button.disabled=false;
            button.innerText="CREATE ACCOUNT";

        }

    };


}


/* ================================================
   MESSAGE FUNCTION
   ================================================ */

function showMessage(text,type){

    const message =
    document.getElementById("message");

    message.className =
    "message " + type;

    message.innerHTML=text;

    message.style.display="block";
}


}catch(error){

    const diagnostic =
    document.getElementById("diagnostic");

    diagnostic.innerHTML =
    "<b>🔴 PROGRAM ERROR</b><br><br>" +

    "<b>Qalad:</b><br>" +
    escapeText(error.message) +

    "<br><br>" +

    "<b>Line-ka:</b> Waxaa la qabtay qalad intii program-ku bilaabanayay." +

    "<br><br>" +

    "<b>Stack:</b><br>" +
    escapeText(error.stack || "No stack information");

}

</script>

</body>
</html>
