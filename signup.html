<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>XAMAAS TEAM - Signup</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #07152b;
      font-family: Arial, sans-serif;
    }

    .signup-box {
      width: 90%;
      max-width: 400px;
      background: #0d2342;
      padding: 30px 25px;
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(0,0,0,0.4);
    }

    h1 {
      text-align: center;
      color: white;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #b8c5d6;
      margin-bottom: 25px;
    }

    label {
      display: block;
      color: white;
      margin-bottom: 7px;
      margin-top: 15px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #ffffff;
      font-size: 16px;
      outline: none;
    }

    .signup-button {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #f2c94c;
      color: #111;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .signup-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      margin-top: 18px;
      text-align: center;
      font-size: 15px;
      line-height: 1.5;
    }

    .back {
      display: block;
      margin-top: 20px;
      text-align: center;
      color: #f2c94c;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="signup-box">

    <h1>XAMAAS TEAM</h1>

    <div class="subtitle">
      Create Player Account
    </div>

    <!-- FULL NAME -->
    <label for="fullname">Full Name</label>

    <input
      type="text"
      id="fullname"
      placeholder="Geli magacaaga"
    >

    <!-- EMAIL -->
    <label for="email">Email</label>

    <input
      type="email"
      id="email"
      placeholder="Geli email-kaaga"
    >

    <!-- PASSWORD -->
    <label for="password">Password</label>

    <input
      type="password"
      id="password"
      placeholder="Geli password"
    >

    <!-- CONFIRM PASSWORD -->
    <label for="confirmPassword">Confirm Password</label>

    <input
      type="password"
      id="confirmPassword"
      placeholder="Ku celi password-ka"
    >

    <!-- BUTTON -->
    <button
      class="signup-button"
      id="signupButton"
      onclick="signup()"
    >
      📝 CREATE ACCOUNT
    </button>

    <!-- MESSAGE -->
    <div
      class="message"
      id="message"
    ></div>

    <!-- BACK -->
    <a
      class="back"
      href="index.html"
    >
      ← Back to Login
    </a>

  </div>


  <script>

    /* =========================================
       SUPABASE CONNECTION
       ========================================= */

    const supabaseUrl =https://iihtxtuilegjslmrkjnp.supabase.co/rest/v1/
    

    const supabaseKey =sb_publishable_lh68Dlz5pKO1lZx5WDS7jA_ODfNaw8W
      


    const supabaseClient =
      window.supabase.createClient(
        supabaseUrl,
        supabaseKey
      );


    /* =========================================
       SIGNUP FUNCTION
       ========================================= */

    async function signup() {

      const fullname =
        document.getElementById("fullname").value.trim();

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      const confirmPassword =
        document.getElementById("confirmPassword").value;

      const message =
        document.getElementById("message");

      const button =
        document.getElementById("signupButton");


      /* -----------------------------------------
         CLEAR MESSAGE
         ----------------------------------------- */

      message.innerText = "";


      /* -----------------------------------------
         CHECK EMPTY FIELDS
         ----------------------------------------- */

      if (
        fullname === "" ||
        email === "" ||
        password === "" ||
        confirmPassword === ""
      ) {

        message.style.color = "#ff8585";

        message.innerText =
          "Fadlan buuxi dhammaan meelaha.";

        return;
      }


      /* -----------------------------------------
         CHECK PASSWORD LENGTH
         ----------------------------------------- */

      if (password.length < 6) {

        message.style.color = "#ff8585";

        message.innerText =
          "Password-ku waa inuu ugu yaraan yahay 6 xaraf.";

        return;
      }


      /* -----------------------------------------
         CHECK PASSWORD MATCH
         ----------------------------------------- */

      if (password !== confirmPassword) {

        message.style.color = "#ff8585";

        message.innerText =
          "Passwords-ku isma laha.";

        return;
      }


      /* -----------------------------------------
         DISABLE BUTTON
         ----------------------------------------- */

      button.disabled = true;

      button.innerText =
        "Creating account...";


      try {

        /* ---------------------------------------
           CREATE SUPABASE ACCOUNT
           --------------------------------------- */

        const { data, error } =
          await supabaseClient.auth.signUp({

            email: email,

            password: password,

            options: {

              data: {

                full_name: fullname

              }

            }

          });


        /* ---------------------------------------
           CHECK ERROR
           --------------------------------------- */

        if (error) {

          message.style.color = "#ff8585";

          message.innerText =
            error.message;

          button.disabled = false;

          button.innerText =
            "📝 CREATE ACCOUNT";

          return;
        }


        /* ---------------------------------------
           SUCCESS
           --------------------------------------- */

        message.style.color = "#62d98b";

        message.innerText =
          "Account-ka waa la sameeyay!";


        /*
          Supabase trigger-keena ayaa hadda
          user-kan ku dari doona:

          public.players

          full_name
          email
          team = Xamaas Team
        */


        button.innerText =
          "Account Created ✓";


        /* ---------------------------------------
           GO LOGIN
           --------------------------------------- */

        setTimeout(function() {

          window.location.href =
            "index.html";

        }, 3000);


      } } catch (err) {

  message.style.color = "#ff8585";

  message.innerText =
    "Qaladku waa: " + err.message;

  button.disabled = false;

  button.innerText =
    "📝 CREATE ACCOUNT";

  console.error(err);

}

      }

    }

  </script>

</body>
</html>
