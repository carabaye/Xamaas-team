<!DOCTYPE html>
<html lang="so">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Xamaas Team - Sign Up</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#07111f;
    color:white;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.signup-box{
    width:100%;
    max-width:430px;
    background:#10243b;
    border:1px solid #304761;
    border-radius:25px;
    padding:30px 25px;
    text-align:center;
}

.logo{
    width:85px;
    height:85px;
    margin:0 auto 18px;
    border-radius:50%;
    background:#d4af37;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:40px;
}

h1{
    color:#d4af37;
    margin-bottom:8px;
}

.subtitle{
    color:#9eacbc;
    margin-bottom:28px;
}

input{
    width:100%;
    padding:16px;
    margin-bottom:14px;
    border-radius:13px;
    border:1px solid #405873;
    background:#07111f;
    color:white;
    font-size:16px;
}

.signup-button{
    width:100%;
    padding:16px;
    border:0;
    border-radius:13px;
    background:#d4af37;
    color:#07111f;
    font-size:17px;
    font-weight:bold;
}

.message{
    margin-top:18px;
    font-size:14px;
}

.back{
    display:block;
    margin-top:20px;
    color:#d4af37;
    text-decoration:none;
}
</style>
</head>

<body>

<div class="signup-box">

    <div class="logo">⚽</div>

    <h1>XAMAAS TEAM</h1>

    <p class="subtitle">Create Your Account</p>

    <input id="fullname" type="text" placeholder="Full Name">

    <input id="email" type="email" placeholder="Email">

    <input id="password" type="password" placeholder="Password">

    <input id="confirmPassword" type="password" placeholder="Confirm Password">

    <button class="signup-button" id="createBtn">
        📝 CREATE ACCOUNT
    </button>

    <div class="message" id="message"></div>

    <a class="back" href="index.html">
        ← Back to Login
    </a>

</div>

<script>

/* 1. SUPABASE XOGTA */

const SUPABASE_URL = "GELI_API_URL_KAAGA";
const SUPABASE_KEY = "GELI_PUBLISHABLE_KEY_KAAGA";


/* 2. SUPABASE */

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* 3. BUTTON */

document.getElementById("createBtn").addEventListener("click", async function(){

    const fullname =
        document.getElementById("fullname").value.trim();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;

    const message =
        document.getElementById("message");


    if(fullname === "" || email === "" || password === "" || confirmPassword === ""){
        message.style.color = "#ff8585";
        message.innerText = "Fadlan buuxi dhammaan meelaha.";
        return;
    }


    if(password !== confirmPassword){
        message.style.color = "#ff8585";
        message.innerText = "Passwords-ku isku mid ma aha.";
        return;
    }


    message.style.color = "#d4af37";
    message.innerText = "Account-ka waa la abuurayaa...";


    const { data, error } =
        await supabaseClient.auth.signUp({

            email: email,

            password: password,

            options: {
                data: {
                    full_name: fullname
                }
            }

        });


    if(error){

        message.style.color = "#ff8585";
        message.innerText = error.message;

        return;
    }


    message.style.color = "#62d98b";
    message.innerText = "Account-ka waa la sameeyay!";


    setTimeout(function(){
        window.location.href = "index.html";
    }, 2000);

});

</script>

</body>
</html>
