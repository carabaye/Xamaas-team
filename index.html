<!DOCTYPE html>
<html lang="so">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Xamaas Team - Login</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#07111f;
    color:white;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.login-box{
    width:100%;
    max-width:430px;
    background:#10243b;
    border:1px solid #304761;
    border-radius:25px;
    padding:30px 25px;
    text-align:center;
    box-shadow:0 15px 40px rgba(0,0,0,.35);
}

.logo{
    width:85px;
    height:85px;
    margin:0 auto 18px;
    border-radius:50%;
    background:#d4af37;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:40px;
}

h1{
    color:#d4af37;
    margin-bottom:8px;
}

.subtitle{
    color:#9eacbc;
    margin-bottom:28px;
}

input{
    width:100%;
    padding:16px;
    margin-bottom:14px;
    border-radius:13px;
    border:1px solid #405873;
    background:#07111f;
    color:white;
    font-size:16px;
    outline:none;
}

input:focus{
    border-color:#d4af37;
}

.login-button{
    width:100%;
    padding:16px;
    border:0;
    border-radius:13px;
    background:#d4af37;
    color:#07111f;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.login-button:hover{
    background:#e7c653;
}

.message{
    margin-top:18px;
    color:#ff8585;
    font-size:14px;
}
</style>
</head>

<body>

<div class="login-box">

    <div class="logo">⚽</div>

    <h1>XAMAAS TEAM</h1>

    <p class="subtitle">
        Football Management System
    </p>

    <input
        type="text"
        id="username"
        placeholder="Username"
    >

    <input
        type="password"
        id="password"
        placeholder="Password"
    >

    <button class="login-button" onclick="login()">
        🔐 LOGIN
    </button>

    <div class="message" id="message"></div>

</div>

<script>

function login(){

    const username =
        document.getElementById("username").value;

    const password =
        document.getElementById("password").value;

    if(username === "" || password === ""){
        document.getElementById("message").innerText =
        "Fadlan geli Username iyo Password.";
        return;
    }

    document.getElementById("message").innerText =
    "Login system-ka database ayaan ku xiri doonaa tallaabada xigta.";

}

</script>

</body>
</html>
