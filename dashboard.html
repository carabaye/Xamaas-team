<!DOCTYPE html>
<html lang="so">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Xamaas Team Dashboard</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#07111f;
  color:white;
  min-height:100vh;
}

.header{
  height:70px;
  background:#0d1b2e;
  border-bottom:2px solid #d4af37;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
}

.logo{
  color:#d4af37;
  font-size:22px;
  font-weight:bold;
}

.menu{
  font-size:28px;
  cursor:pointer;
}

.container{
  max-width:700px;
  margin:auto;
  padding:22px;
}

.welcome{
  margin-bottom:22px;
}

.welcome h1{
  font-size:27px;
  margin-bottom:7px;
}

.welcome span{
  color:#d4af37;
}

.welcome p{
  color:#9baabd;
}

.filters{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-bottom:15px;
}

select{
  width:100%;
  padding:15px;
  border-radius:12px;
  border:1px solid #344b65;
  background:#10243b;
  color:white;
  font-size:15px;
}

.season{
  background:#d4af37;
  color:#07111f;
  font-weight:bold;
}

.full-button{
  width:100%;
  border:0;
  border-radius:13px;
  padding:17px;
  margin-bottom:14px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.payment{
  background:#2468e8;
  color:white;
}

.match{
  background:#d4af37;
  color:#07111f;
}

.cards{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:8px;
}

.card{
  background:#10243b;
  border:1px solid #263e59;
  border-radius:14px;
  padding:20px 10px;
  text-align:center;
  cursor:pointer;
}

.card:hover{
  border-color:#d4af37;
}

.card .icon{
  font-size:28px;
  margin-bottom:8px;
}

.card h3{
  font-size:15px;
  color:#d4af37;
}

.card p{
  color:#8fa0b3;
  font-size:12px;
  margin-top:5px;
}

.bottom{
  display:flex;
  justify-content:center;
  margin-top:25px;
}

.logout{
  background:#242b34;
  color:#ff7777;
  border:1px solid #49363b;
  border-radius:12px;
  padding:14px 50px;
  font-weight:bold;
  cursor:pointer;
}

.footer{
  text-align:center;
  color:#64748b;
  font-size:12px;
  margin-top:30px;
}

@media(max-width:500px){
  .container{
    padding:18px;
  }

  .filters{
    grid-template-columns:1fr 1fr;
  }

  .welcome h1{
    font-size:24px;
  }
}
</style>
</head>

<body>

<header class="header">
  <div class="logo">⚽ XAMAAS TEAM</div>
  <div class="menu">☰</div>
</header>

<main class="container">

  <section class="welcome">
    <h1>WELCOME, <span>PLAYER</span></h1>
    <p>Football Management System</p>
  </section>

  <section class="filters">

    <select>
      <option>2026</option>
      <option>2025</option>
      <option>2024</option>
    </select>

    <select class="season">
      <option>🏆 SEASON</option>
    </select>

    <select>
      <option>-- MONTH --</option>
      <option>January</option>
      <option>February</option>
      <option>March</option>
      <option>April</option>
      <option>May</option>
      <option>June</option>
      <option>July</option>
      <option>August</option>
      <option>September</option>
      <option>October</option>
      <option>November</option>
      <option>December</option>
    </select>

    <select>
      <option>-- WEEK --</option>
      <option>Week 1</option>
      <option>Week 2</option>
      <option>Week 3</option>
      <option>Week 4</option>
    </select>

  </section>

  <button class="full-button payment">
    📊 VIEW PAYMENT REPORT
  </button>

  <button class="full-button match">
    📝 MATCH SUMMARY
  </button>

  <section class="cards">

    <div class="card">
      <div class="icon">👥</div>
      <h3>PLAYERS</h3>
      <p>Team Players</p>
    </div>

    <div class="card">
      <div class="icon">🏆</div>
      <h3>LEADERBOARD</h3>
      <p>Player Ranking</p>
    </div>

    <div class="card">
      <div class="icon">📋</div>
      <h3>ATTENDANCE</h3>
      <p>Attendance Record</p>
    </div>

    <div class="card">
      <div class="icon">⚽</div>
      <h3>MATCHES</h3>
      <p>Match Records</p>
    </div>

  </section>

  <div class="bottom">
    <button class="logout">🚪 LOGOUT</button>
  </div>

  <div class="footer">
    Xamaas Team © 2026
  </div>

</main>

</body>
</html>
