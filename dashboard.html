<!DOCTYPE html>
<html lang="so">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>XAMAAS TEAM - Dashboard</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#020817;
    color:white;
    min-height:100vh;
}

.container{
    width:100%;
    max-width:1000px;
    margin:auto;
    padding:18px;
}

/* HEADER */

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:18px 0 22px;

    border-bottom:3px solid #d4af37;
}

.logo-title{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo{
    font-size:42px;
}

.logo-title h1{
    color:#d4af37;
    font-size:28px;
}

.menu{
    font-size:40px;
}

/* WELCOME */

.welcome{
    margin:38px 0 30px;
}

.welcome h2{
    font-size:34px;
    margin-bottom:15px;
}

.welcome h2 span{
    color:#d4af37;
}

.subtitle{
    color:#8f9bad;
    font-size:22px;
}

/* SELECT AREA */

.select-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:22px;
    margin-bottom:30px;
}

select{
    width:100%;
    padding:20px;

    border-radius:20px;

    background:#1c334d;
    color:white;

    border:1px solid #304761;

    font-size:18px;
}

/* BIG BUTTONS */

.big-button{
    width:100%;

    padding:22px;

    margin-bottom:22px;

    border:none;
    border-radius:25px;

    font-size:22px;
    font-weight:bold;

    cursor:pointer;

    color:white;
}

.payment{
    background:#0645c7;
}

.summary{
    background:#795000;
}

/* MENU CARDS */

.card-grid{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:22px;

    margin-top:45px;
}

.card{
    min-height:190px;

    background:#020d26;

    border:1px solid #263a58;

    border-radius:25px;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    text-align:center;

    cursor:pointer;

    transition:0.2s;
}

.card:hover{
    transform:translateY(-3px);
    border-color:#d4af37;
}

.card-icon{
    font-size:50px;
    margin-bottom:18px;
}

.card h3{
    color:#d4af37;
    font-size:25px;
    margin-bottom:10px;
}

.card p{
    color:#8f9bad;
    font-size:18px;
}

/* LOGOUT */

.logout-area{
    text-align:center;
    margin:50px 0 25px;
}

.logout{
    padding:20px 70px;

    border-radius:20px;

    border:1px solid #444;

    background:#292d34;

    color:#ff7070;

    font-size:20px;

    font-weight:bold;

    cursor:pointer;
}

/* MOBILE */

@media(max-width:650px){

    .container{
        padding:18px;
    }

    .logo{
        font-size:36px;
    }

    .logo-title h1{
        font-size:25px;
    }

    .menu{
        font-size:35px;
    }

    .welcome h2{
        font-size:30px;
    }

    .subtitle{
        font-size:19px;
    }

    .select-grid{
        grid-template-columns:1fr 1fr;
        gap:15px;
    }

    select{
        padding:18px 12px;
        font-size:16px;
    }

    .card-grid{
        gap:15px;
    }

    .card{
        min-height:175px;
    }

    .card-icon{
        font-size:42px;
    }

    .card h3{
        font-size:21px;
    }

    .card p{
        font-size:16px;
    }

    .logout{
        padding:18px 55px;
    }
}

</style>
</head>

<body>

<div class="container">

    <!-- HEADER -->

    <header class="header">

        <div class="logo-title">

            <div class="logo">⚽</div>

            <h1>XAMAAS TEAM</h1>

        </div>

        <div class="menu">☰</div>

    </header>


    <!-- WELCOME -->

    <section class="welcome">

        <h2>
            WELCOME, <span>PLAYER</span>
        </h2>

        <p class="subtitle">
            Football Management System
        </p>

    </section>


    <!-- YEAR & SEASON -->

    <div class="select-grid">

        <select id="year">

            <option value="">2026</option>
            <option>2027</option>
            <option>2028</option>

        </select>


        <select id="season">

            <option value="">🏆 SEASON</option>

            <option>Season 1</option>
            <option>Season 2</option>

        </select>


        <select id="month">

            <option value="">-- MONTH --</option>

            <option>January</option>
            <option>February</option>
            <option>March</option>
            <option>April</option>
            <option>May</option>
            <option>June</option>
            <option>July</option>
            <option>August</option>
            <option>September</option>
            <option>October</option>
            <option>November</option>
            <option>December</option>

        </select>


        <select id="week">

            <option value="">-- WEEK --</option>

            <option>Week 1</option>
            <option>Week 2</option>
            <option>Week 3</option>
            <option>Week 4</option>

        </select>

    </div>


    <!-- REPORT BUTTON -->

    <button
        class="big-button payment"
        onclick="paymentReport()"
    >
        📊 VIEW PAYMENT REPORT
    </button>


    <!-- MATCH SUMMARY -->

    <button
        class="big-button summary"
        onclick="matchSummary()"
    >
        📄 MATCH SUMMARY
    </button>


    <!-- MAIN CARDS -->

    <div class="card-grid">


        <!-- PLAYERS -->

        <div
            class="card"
            onclick="openPage('players.html')"
        >

            <div class="card-icon">👥</div>

            <h3>PLAYERS</h3>

            <p>Team Players</p>

        </div>


        <!-- LEADERBOARD -->

        <div
            class="card"
            onclick="openPage('leaderboard.html')"
        >

            <div class="card-icon">🏆</div>

            <h3>LEADERBOARD</h3>

            <p>Player Ranking</p>

        </div>


        <!-- ATTENDANCE -->

        <div
            class="card"
            onclick="openPage('attendance.html')"
        >

            <div class="card-icon">📋</div>

            <h3>ATTENDANCE</h3>

            <p>Attendance Record</p>

        </div>


        <!-- MATCHES -->

        <div
            class="card"
            onclick="openPage('matches.html')"
        >

            <div class="card-icon">⚽</div>

            <h3>MATCHES</h3>

            <p>Match Records</p>

        </div>

    </div>


    <!-- LOGOUT -->

    <div class="logout-area">

        <button
            class="logout"
            onclick="logout()"
        >
            🚪 LOGOUT
        </button>

    </div>

</div>


<script>

/* OPEN PAGE */

function openPage(page){

    window.location.href = page;

}


/* PAYMENT REPORT */

function paymentReport(){

    alert("Payment Report-ka wali waa la diyaarinayaa.");

}


/* MATCH SUMMARY */

function matchSummary(){

    alert("Match Summary-ga wali waa la diyaarinayaa.");

}


/* LOGOUT */

function logout(){

    window.location.href = "index.html";

}

</script>

</body>
</html>
