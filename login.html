<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xamaas Team - Login</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 300px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        .login-button { width: 100%; background-color: #007bff; color: white; border: none; padding: 10px; cursor: pointer; border-radius: 4px; font-size: 16px; }
        .message { margin-top: 15px; color: red; font-size: 14px; text-align: center; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>Xamaas Team Login</h2>
        <div class="form-group">
            <label>Email ama Username</label>
            <input type="email" id="username" placeholder="Email-kaaga">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Password-kaaga">
        </div>
        <button class="login-button" onclick="login()">🔑 LOGIN</button>
        <div class="message" id="message"></div>
    </div>

    <script>
        const SUPABASE_URL = "https://supabase.co"; 
        // Halkan waxaan ku dhajiyey furihii Publishable key ee saxda ahaa
        const SUPABASE_ANON_KEY = "sb_publishable_lh68Dlz5pKO1lZx5WDS7jA_ODfNaw8W"; 

        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function login() {
            const emailInput = document.getElementById("username").value.trim();
            const passwordInput = document.getElementById("password").value;
            const messageDiv = document.getElementById("message");

            if (emailInput === "" || passwordInput === "") {
                messageDiv.style.color = "red";
                messageDiv.innerText = "Fadlan geli Email iyo Password.";
                return;
            }

            messageDiv.style.color = "blue";
            messageDiv.innerText = "Gudaha loo gelayaa...";

            const { data, error } = await supabase.auth.signInWithPassword({
                email: emailInput,
                password: passwordInput,
            });

            if (error) {
                messageDiv.style.color = "red";
                messageDiv.innerText = "Qalad: " + error.message;
                return;
            }

            if (data.user) {
                messageDiv.style.color = "green";
                messageDiv.innerText = "Login-ku wuu guulaystay!";
                window.location.href = "players.html"; 
            }
        }
    </script>
</body>
</html>
